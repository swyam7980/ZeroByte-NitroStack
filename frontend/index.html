<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroByte — Agentic Pentester</title>

    <!-- Fonts: Geist (UI) + JetBrains Mono (code/IPs/logs) + Material Symbols (icons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN) — carries the Sentinel Intelligence System design tokens. -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "#aec6ff",
              "surface-bright": "#363942",
              "on-background": "#e0e2ed",
              "inverse-on-surface": "#2d3039",
              secondary: "#c6c6c7",
              "error-container": "#93000a",
              "on-secondary-container": "#b4b5b5",
              "on-surface": "#e0e2ed",
              "on-surface-variant": "#c1c6d7",
              "on-error": "#690005",
              "on-primary": "#002e6b",
              "surface-variant": "#32353d",
              "secondary-fixed-dim": "#c6c6c7",
              "on-primary-container": "#ffffff",
              "primary-container": "#0070f3",
              "secondary-fixed": "#e2e2e2",
              "inverse-primary": "#0059c5",
              "tertiary-fixed": "#ffdbcd",
              "on-error-container": "#ffdad6",
              tertiary: "#ffb596",
              "surface-dim": "#10131b",
              "on-secondary": "#2f3131",
              "surface-container-low": "#181b23",
              "on-tertiary-container": "#fffeff",
              surface: "#10131b",
              "surface-container-highest": "#32353d",
              "secondary-container": "#454747",
              "tertiary-container": "#ca4e00",
              "surface-container-high": "#272a32",
              "primary-fixed": "#d8e2ff",
              "on-primary-fixed": "#001a43",
              "outline-variant": "#414754",
              "on-tertiary": "#581e00",
              "on-secondary-fixed-variant": "#454747",
              "surface-tint": "#aec6ff",
              "on-primary-fixed-variant": "#004397",
              "inverse-surface": "#e0e2ed",
              "surface-container": "#1c1f27",
              background: "#10131b",
              outline: "#8b90a0",
              "tertiary-fixed-dim": "#ffb596",
              "on-secondary-fixed": "#1a1c1c",
              primary: "#aec6ff",
              "surface-container-lowest": "#0b0e15",
              "on-tertiary-fixed": "#360f00",
              "on-tertiary-fixed-variant": "#7d2d00",
              error: "#ffb4ab",
              success: "#00e676",
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: {
              unit: "4px",
              "stack-lg": "32px",
              "margin-page": "32px",
              "stack-sm": "8px",
              "container-max": "1440px",
              "stack-md": "16px",
              gutter: "24px",
            },
            fontFamily: {
              "body-lg": ["Geist"],
              "mono-code": ["JetBrains Mono"],
              "label-md": ["Geist"],
              "headline-xl": ["Geist"],
              "body-md": ["Geist"],
              "headline-lg": ["Geist"],
              "headline-md": ["Geist"],
              "headline-lg-mobile": ["Geist"],
            },
            fontSize: {
              "body-lg": ["16px", { lineHeight: "1.6", letterSpacing: "0", fontWeight: "400" }],
              "mono-code": ["13px", { lineHeight: "1.6", letterSpacing: "0", fontWeight: "400" }],
              "label-md": ["12px", { lineHeight: "1.2", letterSpacing: "0.02em", fontWeight: "500" }],
              "headline-xl": ["48px", { lineHeight: "1.1", letterSpacing: "-0.04em", fontWeight: "600" }],
              "body-md": ["14px", { lineHeight: "1.5", letterSpacing: "0", fontWeight: "400" }],
              "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "-0.03em", fontWeight: "600" }],
              "headline-md": ["20px", { lineHeight: "1.4", letterSpacing: "-0.01em", fontWeight: "500" }],
              "headline-lg-mobile": ["24px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "600" }],
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #10131b;
        color: #e0e2ed;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .icon-fill {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }

      /* Gradient border used to mark AI-driven surfaces (blue → purple). */
      .ai-border-glow {
        position: relative;
      }
      .ai-border-glow::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(to right, #0070f3, #6b21a8);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Cleaner dark-mode scrollbars. */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #32353d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #414754;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- NitroChat floating widget — appears as a chat bubble on every page. -->
    <script
      src="https://nitrochat-penteste-zerobyte-amrita-university-amritapuri-campus.app.nitrocloud.ai/widget.js"
      async
      defer
      data-nitrochat-url="https://nitrochat-penteste-zerobyte-amrita-university-amritapuri-campus.app.nitrocloud.ai"
    ></script>
  </body>
</html>
